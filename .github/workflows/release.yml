name: Release

# Publishing is one command for the maintainer:
#     git tag v1.2.0 && git push --tags
# This builds the app, bundles FFmpeg, packs a Velopack release and publishes it. Installed copies
# pick it up on their next update check.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # The tag is the single source of truth, so the app and the release can never disagree.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }

          if (-not $version) { throw 'No version could be determined.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: >
          dotnet publish src/ISpy.App/ISpy.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishReadyToRun=true
          --output publish

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          # The n9.0 RELEASE build, LGPL shared, pinned to match FFmpeg.AutoGen 9.0.x. Never the
          # master snapshot: it changes daily, and the struct offsets the bindings bake in are only
          # guaranteed against the release the bindings were generated from - a mismatch is memory
          # corruption at the first decoded frame, not an error message.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract

          # FFmpegRuntime looks for an "ffmpeg" folder beside the executable first.
          New-Item -ItemType Directory -Force -Path publish/ffmpeg | Out-Null
          Get-ChildItem -Path ffmpeg-extract -Recurse -Filter *.dll |
            Copy-Item -Destination publish/ffmpeg -Force

          # Fail the release now rather than shipping an app whose decoder cannot load.
          foreach ($dll in 'avcodec-63.dll','avformat-63.dll','avutil-61.dll','swscale-10.dll') {
            if (-not (Test-Path "publish/ffmpeg/$dll")) { throw "Missing $dll in the FFmpeg bundle" }
          }

      - name: Install Velopack
        # Pinned to the Velopack library version in ISpy.App: vpk refuses to pack when the two
        # disagree, and an unpinned install would start failing the day upstream releases 1.3.
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Fetch the previous release
        # Gives vpk the previous full package to diff against, so this release also ships a
        # delta - the difference between an update being ~1 MB and being the whole 130 MB app.
        # "|| true" because the very first release has nothing to download.
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases || echo "No previous release to diff against."

      - name: Pack release
        run: >
          vpk pack
          --packId ISpy
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe ISpy.exe
          --packTitle "ISpy"
          --packAuthors "ISpy"
          --icon src/ISpy.App/Assets/ISpy.ico
          --outputDir releases

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ISpy ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: releases/*
