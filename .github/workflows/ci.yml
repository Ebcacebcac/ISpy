name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # The Windows-only projects compile here thanks to EnableWindowsTargeting, and the test project
    # is plain net9.0, so the whole solution is verified on a Linux runner.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
